# GameVault Uploader next to an existing GameVault server.
# "Publish a Game" in the client (Admin Console) then sends games to it from any computer.
services:
  gamevault-uploader:
    # Published with every release of the client; or build it: docker build -f GameVault.Uploader/Dockerfile .
    image: ghcr.io/aredi/gamevault-uploader:latest
    restart: unless-stopped
    # Owner of the games folder, so the uploaded archives can be written (id -u / id -g of that user)
    user: "1000:1000"
    environment:
      # The GameVault server as seen from this container (it checks that the user is an administrator)
      GAMEVAULT_URL: http://gamevault-backend:8080
      # Optional: game requests go to the RomM-ComM Discord bot (its REQUESTS_API_KEY), with the ones made in Discord
      # ROMM_COMM_URL: http://romm-sync:8095
      # ROMM_COMM_API_KEY: change-me
      # Optional: the games of the other platforms (NES... GameCube, PS2, 3DS), from RomM, played in the client with RetroArch
      # ROMM_URL: http://romm:8080
      # ROMM_USERNAME: sanctuaryvault
      # ROMM_PASSWORD: change-me
      # Optional: LAN rooms (the PC games made for a LAN, played over the Internet) with the ZeroTier controller below
      # ZEROTIER_CONTROLLER_URL: http://zerotier-controller:9993
      # ZEROTIER_API_SECRET: change-me-to-a-long-random-string
    volumes:
      # The same folder the GameVault server has as /files
      - /path/to/your/games:/files
      # The players' profiles (showcases, favorite game...): a folder writable by the "user:" above
      - ./data:/data
      # Optional: the savefiles volume of the GameVault server, read-only, to restore older cloud saves
      # - /path/to/gamevault/savefiles:/savefiles:ro
    ports:
      - "7477:8080"
    # Behind a reverse proxy (HTTPS), turn off request buffering for this host:
    #   proxy_request_buffering off;  client_max_body_size 80m;

  # Optional: the ZeroTier network controller of the LAN rooms. Version 1.14.2: its license (BSL 1.1) became Apache 2.0
  # on 2026-01-01; the controller of the later versions is not free for a service like this one.
  # zerotier-controller:
  #   image: zerotier/zerotier:1.14.2
  #   restart: unless-stopped
  #   environment:
  #     ZEROTIER_API_SECRET: change-me-to-a-long-random-string
  #   volumes:
  #     # Its identity and networks; put a local.conf there so that the uploader may use its API:
  #     #   {"settings": {"allowManagementFrom": ["172.16.0.0/12"]}}
  #     - ./zerotier:/var/lib/zerotier-one
  #   ports:
  #     # The players' PCs reach it straight (otherwise through ZeroTier's relays)
  #     - "9993:9993/udp"
