name: CI
on:
  push:
    branches-ignore:
      - master
      - develop
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Run tests
        run: dotnet test GameVault.Core.Tests/GameVault.Core.Tests.csproj --configuration Release
      - name: Run end-to-end UI tests (headless app against a fake server)
        run: dotnet test GameVault.UiTests/GameVault.UiTests.csproj --configuration Release

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Build Avalonia client
        run: dotnet build gamevault/gamevault.csproj --configuration Release
