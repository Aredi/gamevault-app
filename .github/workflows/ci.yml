name: CI
on:
  push:
    branches-ignore:
      - master
      - develop
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Run tests
        run: dotnet test GameVault.Core.Tests/GameVault.Core.Tests.csproj --configuration Release

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Build WPF client
        run: dotnet build gamevault/gamevault.csproj --configuration Release
